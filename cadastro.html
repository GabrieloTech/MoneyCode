<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TI103</title>
    <link rel="stylesheet" href="style/login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">

        <p id="mensagem" style="text-align:center; font-weight: 600; margin-bottom: 10px;"></p>

        <form action="banco_de_dados/salvar.php" method="POST">

            <h1>MONEY CODE</h1>

            <div class="input-box">
                <input type="text" name="nome" placeholder="Nome completo" required>
                <i class="bx bx-user"></i>
            </div>

            <div class="input-box">
                <input type="email" name="email" placeholder="E-mail" required>
                <i class="bx bx-envelope"></i>
            </div>

            <div class="input-box">
                <input type="password" name="senha" placeholder="Senha" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <button type="submit" class="login">Cadastrar</button>

            <div class="register-link">
                <p>Já possui uma conta?
                    <a href="login.html">Faça Login</a>
                </p>
            </div>

        </form>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const msg = document.getElementById("mensagem");

        if (params.get("status") === "erro_email") {
            msg.style.color = "red";
            msg.innerText = "Este e-mail já está cadastrado!";
        } else if (params.get("status") === "erro") {
            msg.style.color = "red";
            msg.innerText = "Erro ao realizar cadastro. Tente novamente.";
        }
    </script>

</body>
</html>
